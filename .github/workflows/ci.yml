name: CI

on:
  push:          # every branch, so phase branches are checked before they are merged
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - name: Install (CPU-only torch)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .   # rules in pyproject.toml
      - name: Unit tests
        run: pytest -q
      - name: End-to-end on the sample video (real models)
        run: pytest -q -m slow

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sentinel-ai .
      - name: Smoke test (demo mode, no camera)
        run: |
          docker run -d --name sentinel -p 8000:8000 sentinel-ai
          for i in $(seq 1 40); do
            if curl -fs http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'; then break; fi
            sleep 3
          done
          sleep 15
          curl -fs http://127.0.0.1:8000/api/stats | tee stats.json
          python3 -c "import json; s=json.load(open('stats.json')); assert s['frames_processed'] > 50, s"
          curl -fs http://127.0.0.1:8000/ | grep -q "Sentinel AI"
      - name: Logs
        if: always()
        run: docker logs sentinel || true
